<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profit & Growth Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #ffffff; color: #0f172a; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }

  .container { max-width: 1120px; margin: 0 auto; padding: 56px 24px 64px; }
  @media (min-width: 768px) { .container { padding: 80px 32px 96px; } }

  .badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; border: 1px solid #e2e8f0; background: #fff; color: #475569; font-size: 13px; font-weight: 500; }
  .badge svg { width: 14px; height: 14px; }

  h1 { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; color: #0f172a; margin-bottom: 16px; line-height: 1.15; }
  @media (min-width: 768px) { h1 { font-size: 48px; } }
  .subtitle { color: #64748b; font-size: 17px; max-width: 640px; line-height: 1.6; }

  .pills { display: flex; flex-wrap: wrap; gap: 10px; margin: 32px 0 40px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; border: 1px solid #e2e8f0; background: #fff; color: #334155; font-size: 14px; font-weight: 500; }
  .pill:hover, .pill:focus { border-color: #cbd5e1; background: #f8fafc; box-shadow: 0 1px 2px rgba(15,23,42,0.04); outline: none; }
  .pill svg { width: 16px; height: 16px; }

  .section { margin-bottom: 44px; scroll-margin-top: 24px; }
  .section-header { padding-left: 16px; border-left: 3px solid; margin-bottom: 20px; }
  .section-header h2 { font-size: 24px; font-weight: 600; color: #0f172a; letter-spacing: -0.01em; }
  @media (min-width: 768px) { .section-header h2 { font-size: 26px; } }
  .section-header p { color: #64748b; font-size: 15px; margin-top: 4px; }

  .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 1024px) { .grid { grid-template-columns: 1fr 1fr; } }

  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 24px; box-shadow: 0 1px 2px rgba(15,23,42,0.04); transition: box-shadow 0.2s ease; }
  @media (min-width: 768px) { .card { padding: 28px; } }
  .card:hover { box-shadow: 0 4px 16px rgba(15,23,42,0.06); }

  .field { margin-bottom: 20px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 13px; font-weight: 500; color: #334155; margin-bottom: 8px; }
  .input-wrap { display: flex; align-items: center; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; overflow: hidden; transition: border-color 0.2s ease, box-shadow 0.2s ease; }
  .input-wrap:focus-within { border-color: #94a3b8; box-shadow: 0 0 0 2px #f1f5f9; }
  .input-wrap .prefix { padding: 0 8px 0 14px; font-size: 13px; font-weight: 500; color: #94a3b8; user-select: none; }
  .input-wrap .divider { width: 1px; height: 20px; background: #e2e8f0; }
  .input-wrap input { flex: 1; border: 0; outline: 0; padding: 12px 14px; background: transparent; font-size: 15px; color: #0f172a; font-family: inherit; }
  .input-wrap input::placeholder { color: #cbd5e1; }

  .result-card { min-height: 152px; display: flex; flex-direction: column; margin-bottom: 20px; }
  .result-card:last-child { margin-bottom: 0; }
  .result-head { display: flex; align-items: flex-start; gap: 14px; }
  .icon-box { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 1px 2px rgba(15,23,42,0.08); }
  .icon-box svg { width: 20px; height: 20px; color: #fff; stroke-width: 2.25; }
  .result-meta .title { font-size: 15px; font-weight: 600; color: #0f172a; line-height: 1.2; }
  .result-meta .formula { font-size: 12.5px; color: #64748b; margin-top: 2px; }

  .result-value { margin-top: 20px; flex: 1; display: flex; align-items: flex-end; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; color: #cbd5e1; transition: color 0.25s ease; }
  @media (min-width: 768px) { .result-value { font-size: 34px; } }
  .result-value.filled { color: inherit; }

  /* Default: all numeric results show orange (non-important so overrides can win) */
  .result-value { color: #f97316; }

  /* YOY overrides with higher specificity and !important to ensure they win */
  .result-value[data-out*="yoy"].positive,
  .result-value#out-yoy-val.positive,
  [data-out*="yoy"].positive,
  #out-yoy-val.positive {
    color: #10b981 !important; /* green */
  }
  .result-value[data-out*="yoy"].negative,
  .result-value#out-yoy-val.negative,
  [data-out*="yoy"].negative,
  #out-yoy-val.negative {
    color: #ef4444 !important; /* red */
  }

  .small { font-size: 13px; color: #64748b; margin-top: 6px; }
  .switch { display: inline-flex; align-items: center; gap: 10px; }

  .footer { margin-top: 48px; padding-top: 32px; border-top: 1px solid #e2e8f0; text-align: center; color: #94a3b8; font-size: 14px; }

  /* Accent colors */
  .bg-slate-900 { background: #0f172a; }
  .bg-emerald-500 { background: #10b981; }
  .bg-indigo-600 { background: #4f46e5; }
  .bg-orange-500 { background: #f97316; }
  .border-slate-900 { border-color: #0f172a; }
  .border-emerald-500 { border-color: #10b981; }
  .border-indigo-600 { border-color: #4f46e5; }
  .border-orange-500 { border-color: #f97316; }
  .text-slate-900 { color: #0f172a; }
  .text-emerald-500 { color: #10b981; }
  .text-indigo-600 { color: #4f46e5; }
  .text-orange-500 { color: #f97316; }

  /* Screen-reader only */
  .sr-only {
    position: absolute !important;
    height: 1px; width: 1px;
    overflow: hidden;
    clip: rect(1px, 1px, 1px, 1px);
    white-space: nowrap;
    border: 0; padding: 0; margin: -1px;
  }
</style>
</head>
<body>

<!-- SVG icon defs -->

<header class="container" style="padding-top:32px;padding-bottom:0">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;">
    <div>
      <span class="badge">Demo</span>
      <h1>Profit & Growth Calculator</h1>
      <p class="subtitle">A simple, static calculator demo for Profit and Growth with YoY highlighting.</p>
    </div>
  </div>
</header>

<main class="container">
  <section class="grid">
    <div class="card">
      <div class="field">
        <label>Revenue</label>
        <div class="input-wrap"><div class="prefix">$</div><input type="number" data-in="revenue" value="100000" /></div>
      </div>
      <div class="field">
        <label>Cost</label>
        <div class="input-wrap"><div class="prefix">$</div><input type="number" data-in="cost" value="85000" /></div>
      </div>
    </div>

    <div class="card result-card">
      <div class="result-head">
        <div class="icon-box bg-indigo-600"></div>
        <div class="result-meta">
          <div class="title">YoY Growth</div>
          <div class="formula">(this - last) / last</div>
        </div>
      </div>
      <div id="out-yoy-val" class="result-value" data-out="yoy-val">+15.3%</div>
    </div>
  </section>

  <div class="footer">Built with ❤️</div>
</main>

<!-- TEMP: disabled external scripts to diagnose white-page issue -->
<!-- Original scripts commented out. If this fixes the site, I'll re-enable them one-by-one to find the culprit. -->
<!-- <script src="app.js" defer></script>
<script src="yoy-coloring.js" defer></script>
-->

<!-- Keep a tiny inline script to wire the demo inputs (safe) -->
<script>
(function(){
  function update() {
    const r = parseFloat(document.querySelector('[data-in="revenue"]').value) || 0;
    const c = parseFloat(document.querySelector('[data-in="cost"]').value) || 0;
    const profit = r - c;
    const yoyEl = document.getElementById('out-yoy-val');
    // fake yoy: profit / r * 100 - just demo
    const yoy = r ? ((profit / r) * 100).toFixed(1) : 0;
    const sign = (String(yoy)[0] === '-') ? '' : '+';
    yoyEl.textContent = sign + yoy + '%';
    // color update mimic (no external script)
    yoyEl.classList.remove('positive','negative');
    const n = parseFloat(yoy);
    if (n > 0) yoyEl.classList.add('positive');
    else if (n < 0) yoyEl.classList.add('negative');
  }
  document.querySelectorAll('[data-in]').forEach(i=> i.addEventListener('input', update));
  window.addEventListener('load', update);
})();
</script>

</body>
</html>
